<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="main-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB966"/>
      <stop offset="40%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#CC4400"/>
    </linearGradient>
    <linearGradient id="arrow-orange-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#B33600"/>
    </linearGradient>
  </defs>

  <!-- White Background -->
  <rect width="500" height="500" fill="#FFFFFF"/>

  <!-- 3D Shadow Layer -->
  <path d="M 145 110 L 405 260 L 145 410 Q 90 410 90 350 L 90 170 Q 90 110 145 110 Z" fill="#A33200" />

  <!-- Main Film Strip & Play Button -->
  <path d="M 135 100 L 395 250 L 135 400 Q 80 400 80 340 L 80 160 Q 80 100 135 100 Z" fill="url(#main-orange-grad)" stroke="#FFF0E6" stroke-width="8" stroke-linejoin="round"/>

  <!-- Glossy Effect -->
  <path d="M 80 230 L 395 250" stroke="#FFFFFF" stroke-width="1.5" opacity="0.35" />

  <!-- Film Strip Holes -->
  <rect x="100" y="140" width="16" height="28" rx="6" fill="#1A0A00"/>
  <rect x="100" y="195" width="16" height="28" rx="6" fill="#1A0A00"/>
  <rect x="100" y="250" width="16" height="28" rx="6" fill="#1A0A00"/>
  <rect x="100" y="305" width="16" height="28" rx="6" fill="#1A0A00"/>
  <rect x="100" y="360" width="16" height="28" rx="6" fill="#1A0A00"/>

  <!-- Center Downward Arrow -->
  <path d="M 225 135 L 275 135 L 275 255 L 335 255 L 250 395 L 165 255 L 225 255 Z" fill="url(#arrow-orange-grad)" stroke="#FFF5EE" stroke-width="10" stroke-linejoin="round"/>
</svg>
