<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 570 556"
     role="img"
     aria-label="MovieBox icon">

  <defs>

    <!-- Dark Background -->
    <radialGradient id="mb-bg"
                     cx="50%" cy="45%"
                     r="75%">
      <stop offset="0%" stop-color="#071B43"/>
      <stop offset="65%" stop-color="#031536"/>
      <stop offset="100%" stop-color="#020E29"/>
    </radialGradient>

    <!-- Film Strip -->
    <linearGradient id="mb-film"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="30%" stop-color="#FFAA00"/>
      <stop offset="60%" stop-color="#FFD21A"/>
      <stop offset="100%" stop-color="#FF7200"/>
    </linearGradient>

    <!-- Arrow -->
    <linearGradient id="mb-arrow"
                    x1="50%" y1="0%"
                    x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFE12B"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF6500"/>
    </linearGradient>

    <!-- Blue Play -->
    <linearGradient id="mb-blue"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19D9FF"/>
      <stop offset="45%" stop-color="#087CFF"/>
      <stop offset="100%" stop-color="#1439E8"/>
    </linearGradient>

    <!-- Background Dots -->
    <pattern id="mb-dots"
             width="20"
             height="20"
             patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4"
              r="1.5"
              fill="#0874E8"
              opacity="0.65"/>
    </pattern>

    <!-- Glow -->
    <filter id="mb-glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="5"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="570"
        height="556"
        fill="url(#mb-bg)"/>

  <!-- Top Dots -->
  <rect x="0"
        y="0"
        width="570"
        height="130"
        fill="url(#mb-dots)"/>

  <!-- Bottom Dots -->
  <rect x="0"
        y="455"
        width="570"
        height="101"
        fill="url(#mb-dots)"/>


  <!-- Blue Play Shape -->
  <path
    d="M210 82
       L451 224
       Q489 247 451 270
       L210 414
       Q135 439 135 360
       L135 139
       Q135 58 210 82Z"
    fill="url(#mb-blue)"
    stroke="#FFFFFF"
    stroke-width="7"
    stroke-linejoin="round"
    filter="url(#mb-glow)"/>


  <!-- Blue Highlight -->
  <path
    d="M326 151
       L447 223
       Q469 236 447 249
       L326 321Z"
    fill="#24D5FF"
    opacity="0.42"/>


  <!-- Orange / Yellow Film Strip -->
  <path
    d="M185 82
       Q135 67 135 139
       L135 360
       Q135 439 185 414
       L326 329
       L326 166Z"
    fill="url(#mb-film)"
    stroke="#FFFFFF"
    stroke-width="7"
    stroke-linejoin="round"/>


  <!-- Film Strip Highlight -->
  <path
    d="M151 105
       Q143 120 143 145
       L143 350
       Q143 382 155 394
       L181 380
       L181 101
       Q165 98 151 105Z"
    fill="#FF6500"
    opacity="0.30"/>


  <!-- Film Holes -->
  <rect x="157" y="112"
        width="19"
        height="33"
        rx="7"
        fill="#06183A"/>

  <rect x="157" y="169"
        width="19"
        height="33"
        rx="7"
        fill="#06183A"/>

  <rect x="157" y="226"
        width="19"
        height="33"
        rx="7"
        fill="#06183A"/>

  <rect x="157" y="283"
        width="19"
        height="33"
        rx="7"
        fill="#06183A"/>

  <rect x="157" y="340"
        width="19"
        height="33"
        rx="7"
        fill="#06183A"/>


  <!-- Download Arrow -->
  <path
    d="M231 129
       L281 129
       L281 250
       L335 250
       L278 347
       L221 250
       L231 250Z"
    fill="url(#mb-arrow)"
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linejoin="round"
    filter="url(#mb-glow)"/>


  <!-- Arrow Highlight -->
  <path
    d="M240 140
       L269 140
       L269 253
       L302 253
       L278 294
       L240 231Z"
    fill="#FFF06A"
    opacity="0.25"/>


  <!-- Gloss -->
  <path
    d="M184 83 L445 236"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2"
    opacity="0.30"/>

</svg>
